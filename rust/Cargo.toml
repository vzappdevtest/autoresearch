[package]
name = "autoresearch"
version = "0.1.0"
edition = "2021"
description = "Rust port of autoresearch: load GGUF-format LLMs and generate text"
license = "MIT"

[[bin]]
name = "autoresearch"
path = "src/main.rs"

[dependencies]
candle-core = "0.9"
candle-transformers = "0.9"
tokenizers = { version = "0.21", default-features = false, features = ["onig"] }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
default = []
# Build with a CUDA backend (requires a working CUDA toolkit + NVIDIA GPU).
cuda = ["candle-core/cuda", "candle-transformers/cuda"]
# Build with the Apple Metal backend (macOS only).
metal = ["candle-core/metal", "candle-transformers/metal"]

[profile.release]
opt-level = 3
lto = "thin"
